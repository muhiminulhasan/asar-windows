name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # windows-latest runners are x64: ARM64 is cross-compiled and cannot
        # be tested there, so only its build runs.
        arch: [x64, Win32, ARM64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'Win32' && 'x86' || matrix.arch }}

      - name: Configure
        run: cmake -S . -B build/${{ matrix.arch }} -A ${{ matrix.arch }}

      - name: Build
        run: cmake --build "build/${{ matrix.arch }}" --config Release

      - name: Test
        if: matrix.arch != 'ARM64'
        run: ctest --test-dir "build/${{ matrix.arch }}" -C Release --output-on-failure

      - name: Cross-check against official @electron/asar
        if: matrix.arch == 'x64'
        run: node scripts/crosscheck.mjs build\x64\tools\asar\Release\asar.exe

      - name: Package release zips
        shell: pwsh
        run: |
          $v = ("${{ github.ref_name }}" -replace '^v', '')
          if ($v -notmatch '^[0-9]') { $v = '0.0.0' }
          scripts/package.ps1 -Arch ${{ matrix.arch }} -BuildDir "build/${{ matrix.arch }}" -Version $v

      - name: Upload per-package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: asar-windows-${{ matrix.arch }}
          path: |
            release/**/7z-plugin-*.zip
            release/**/asarfolder-*.zip
            release/**/explorer-tools-*.zip
            release/**/asar-lib-*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach zips to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
